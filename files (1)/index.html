<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AR Test — Planet Intelligence</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #info {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white;
      font-family: sans-serif; font-size: 13px;
      padding: 8px 14px; border-radius: 16px;
      z-index: 999; pointer-events: none;
      white-space: nowrap;
    }
  </style>

  <script>
  AFRAME.registerComponent('lsystem-tree', {
    schema: {
      duration:   { type: 'number',  default: 6000  }, // 全成長にかかるms
      iterations: { type: 'number',  default: 5     }, // L-System展開回数
      angle:      { type: 'number',  default: 25    }, // 分岐角度(度)
      length:     { type: 'number',  default: 0.12  }, // 基本枝長(m)
      thickness:  { type: 'number',  default: 1.2   }, // 線の太さ
      color:      { type: 'color',   default: '#c8e6c9' }
    },

    init: function () {
      this.segments   = [];   // [{start, end, depth}]
      this.lines      = [];   // THREE.Line objects
      this.startTime  = null;
      this.built      = false;

      // L-Systemルール (Fraktal木)
      const axiom   = 'X';
      const rules   = { X: 'F+[[X]-X]-F[-FX]+X', F: 'FF' };

      const str = this._expand(axiom, rules, this.data.iterations);
      this._buildSegments(str, this.data.angle, this.data.length);
      this._createLines();
    },

    // L-System文字列展開
    _expand: function (axiom, rules, n) {
      let s = axiom;
      for (let i = 0; i < n; i++) {
        s = s.split('').map(c => rules[c] || c).join('');
      }
      return s;
    },

    // 文字列 → 枝セグメント配列
    _buildSegments: function (str, angleDeg, baseLen) {
      const DEG = Math.PI / 180;
      const stack = [];
      let x = 0, y = 0, z = 0;
      let ax = 0, ay = 1, az = 0; // 上向き方向ベクトル
      let pitch = 0; // XZ面の回転角
      let depth = 0;
      const segs = this.segments;

      // シンプルな2Dタートル (Y軸が上、XZ面で回転)
      let angle = 0; // 現在の向き(rad, XZ平面)
      let tilt  = Math.PI / 2; // 仰角(rad) 初期は真上

      const stateStack = [];
      let cx = 0, cy = 0;
      let dir = Math.PI / 2; // 真上 = 90deg

      // 2Dタートル (XY平面、後でY→Y, X→X, Z=0)
      for (let i = 0; i < str.length; i++) {
        const c = str[i];
        if (c === 'F') {
          const nx = cx + Math.cos(dir) * baseLen;
          const ny = cy + Math.sin(dir) * baseLen;
          segs.push({
            x1: cx, y1: cy,
            x2: nx, y2: ny,
            order: segs.length
          });
          cx = nx; cy = ny;
        } else if (c === '+') {
          dir += angleDeg * DEG;
        } else if (c === '-') {
          dir -= angleDeg * DEG;
        } else if (c === '[') {
          stateStack.push({ cx, cy, dir });
        } else if (c === ']') {
          const s = stateStack.pop();
          cx = s.cx; cy = s.cy; dir = s.dir;
        }
        // X は描画なし（展開のみ）
      }
    },

    // THREE.Line を生成（初期は長さ0）
    _createLines: function () {
      const color = new THREE.Color(this.data.color);
      const mat = new THREE.LineBasicMaterial({
        color: color,
        linewidth: this.data.thickness,
        transparent: true,
        opacity: 0.92
      });

      this.lines = this.segments.map(seg => {
        // 2D座標 → 3D (XY → XY、Z=0)
        // マーカー上でYが高さ軸
        const points = [
          new THREE.Vector3(seg.x1, seg.y1, 0),
          new THREE.Vector3(seg.x1, seg.y1, 0)  // 初期は長さ0
        ];
        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geo, mat);
        this.el.object3D.add(line);
        return { line, seg };
      });
    },

    tick: function (time, delta) {
      if (!this.startTime) this.startTime = time;
      if (this.built) return;

      const elapsed  = time - this.startTime;
      const total    = this.segments.length;
      const duration = this.data.duration;

      // 各枝が順番に伸びる
      const progress = Math.min(elapsed / duration, 1.0);
      const revealed = progress * total; // 何本目まで表示するか（小数含む）

      for (let i = 0; i < this.lines.length; i++) {
        const { line, seg } = this.lines[i];
        const geo = line.geometry;
        const pos = geo.attributes.position;

        if (i < Math.floor(revealed)) {
          // 完全に表示
          pos.setXYZ(0, seg.x1, seg.y1, 0);
          pos.setXYZ(1, seg.x2, seg.y2, 0);
        } else if (i < revealed) {
          // この枝はアニメーション中（部分的に伸びる）
          const t = revealed - Math.floor(revealed);
          const ix = seg.x1 + (seg.x2 - seg.x1) * t;
          const iy = seg.y1 + (seg.y2 - seg.y1) * t;
          pos.setXYZ(0, seg.x1, seg.y1, 0);
          pos.setXYZ(1, ix, iy, 0);
        } else {
          // まだ非表示
          pos.setXYZ(0, seg.x1, seg.y1, 0);
          pos.setXYZ(1, seg.x1, seg.y1, 0);
        }

        pos.needsUpdate = true;
        geo.computeBoundingSphere();
      }

      if (progress >= 1.0) this.built = true;
    },

    remove: function () {
      this.lines.forEach(({ line }) => {
        this.el.object3D.remove(line);
        line.geometry.dispose();
        line.material.dispose();
      });
    }
  });
  </script>
</head>
<body>
  <div id="info">マーカーにカメラを向けてください</div>
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">
    <a-marker type="pattern" url="pattern-pattern-Planet-A-square.patt">
      <!-- L-System 木：根元から枝が6秒かけて育つ -->
      <a-entity
        lsystem-tree="duration: 6000; iterations: 5; angle: 25; length: 0.12; color: #c8e6c9"
        position="0 0 0"
        rotation="-90 0 0">
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
