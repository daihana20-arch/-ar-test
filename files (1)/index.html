<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LMPI — Akumulacija tišine</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#fff}

/* ── AR.JS: hide hiro marker download popup ── */
.arjs-loader,
#arjs-instructions,
.arjs-instructions,
a-scene > div[style*="position: absolute"],
body > div[style*="z-index: 999"],
body > div[style*="z-index:999"]{
  display:none!important;
  pointer-events:none!important;
}

/* ── AR.JS CAMERA CANVAS ── */
.a-canvas{
  position:fixed!important;top:0!important;left:0!important;
  width:100vw!important;height:100vh!important;
  z-index:1!important;pointer-events:none!important;
  opacity:1!important;
  filter:none!important;
  background:transparent!important;
}
a-scene{
  position:fixed!important;top:0!important;left:0!important;
  width:100vw!important;height:100vh!important;
  z-index:1!important;pointer-events:none!important;
  background:transparent!important;
}
/* AR.js injects video directly into body */
body>video:not(#ar-vessel){
  position:fixed!important;
  top:50%!important;left:50%!important;
  min-width:100vw!important;min-height:100vh!important;
  width:auto!important;height:auto!important;
  transform:translate(-50%,-50%)!important;
  object-fit:cover!important;
  z-index:1!important;pointer-events:none!important;
  opacity:1!important;
  filter:none!important;
}

/* ── START ── */
#start-overlay{
  position:fixed;inset:0;z-index:200;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity 0.8s ease;
}
#start-overlay.out{opacity:0;pointer-events:none}
.s-label{font-size:10px;letter-spacing:0.4em;color:#333;text-transform:uppercase}
.s-title{font-size:clamp(28px,8vw,48px);font-family:Georgia,serif;font-style:italic;text-align:center;line-height:1.15}
.s-sub{font-size:10px;letter-spacing:0.25em;color:#333;margin-bottom:20px}
#start-btn{
  background:none;border:1px solid #2a2a2a;color:#555;
  font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.35em;
  text-transform:uppercase;padding:16px 40px;cursor:pointer;transition:all 0.4s;
}
#start-btn:hover{border-color:#666;color:#fff}

/* ── PHASE 1: BREATH ── */
#phase-breath{
  position:fixed;inset:0;z-index:100;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;
  transition:opacity 1.5s ease;
}
#phase-breath.out{opacity:0;pointer-events:none;display:none!important}
#breath-canvas{display:block;background:transparent;visibility:hidden}
#breath-instr{font-size:12px;letter-spacing:0.28em;color:rgba(255,255,255,0.4);text-align:center;min-height:18px;transition:opacity 0.5s}
#breath-dots{display:flex;gap:12px}
.bdot{width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);transition:all 0.6s}
.bdot.done{background:#4aff6a;border-color:#4aff6a;box-shadow:0 0 8px rgba(74,255,106,0.6)}
.bdot.active{background:rgba(74,255,106,0.35);border-color:rgba(74,255,106,0.5)}

/* ── PHASE 2: AR ── */
#phase-ar{
  position:fixed;inset:0;z-index:15;opacity:0;pointer-events:none;
  transition:opacity 1.5s ease;
}
#phase-ar.visible{opacity:1;pointer-events:none}
#video{display:none!important}
#cv-main{position:fixed;inset:0;z-index:16;background:transparent}
#cv-glitch{position:fixed;inset:0;z-index:18;pointer-events:none;background:transparent}
#cv-vasc{position:fixed;inset:0;z-index:19;pointer-events:none;background:transparent}
#phase-breath{background:transparent!important}

/* HUD */
.hud{position:fixed;z-index:20;font-size:10px;letter-spacing:0.12em;line-height:2;text-shadow:0 0 10px rgba(0,0,0,1);pointer-events:none;opacity:0;transition:opacity 1.8s}
#hud-tl{top:24px;left:20px}
#hud-tr{top:24px;right:20px;text-align:right;color:rgba(255,255,255,0.3)}
#hud-bl{bottom:44px;left:20px;color:rgba(255,255,255,0.3);font-size:9px}
.hl{color:rgba(255,255,255,0.3);margin-right:6px}
.dv-sun{color:#ffd060}.dv-water{color:#60c8ff}.dv-heat{color:#ff7040}.dv-wind{color:rgba(255,255,255,0.85)}
#hud-tl.show,#hud-tr.show,#hud-bl.show{opacity:1}

/* Science data panel */
#sci-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:22;
  padding:28px 32px 36px;
  background:linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
  opacity:0;transition:opacity 2s;pointer-events:none;
}
#sci-panel.show{opacity:1}
#sci-main{font-size:clamp(18px,4.5vw,28px);font-family:Georgia,serif;font-style:italic;color:rgba(255,255,255,0.92);line-height:1.45;margin-bottom:10px;text-shadow:0 0 20px rgba(0,0,0,1)}
#sci-sub{font-size:13px;letter-spacing:0.15em;color:#ccff00;font-family:'Courier New',monospace;text-shadow:0 0 10px rgba(0,0,0,1)}


/* ── PHASE 4: TEXT + COUNTDOWN ── */
#phase-text{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  opacity:0;pointer-events:none;transition:opacity 2s ease;
  background:rgba(0,0,0,0.4);
}
#phase-text.visible{opacity:1}
.poem-line{
  font-family:Georgia,serif;font-style:italic;
  font-size:clamp(20px,5vw,36px);
  color:rgba(255,255,255,0.92);text-align:center;line-height:1.9;
  text-shadow:0 0 30px rgba(0,0,0,1),0 0 60px rgba(0,0,0,0.8);
  opacity:0;transform:translateY(8px);
  transition:opacity 1.1s ease,transform 1.1s ease;
}
.poem-line.show{opacity:1;transform:translateY(0)}

#countdown-wrap{
  position:fixed;inset:0;z-index:51;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  opacity:0;pointer-events:none;transition:opacity 1.5s;
}
#countdown-wrap.visible{opacity:1}
#cdown-prompt{font-size:13px;letter-spacing:0.3em;color:rgba(255,255,255,0.5);text-align:center;line-height:1.7}
#cdown-prompt span{display:block}
#cdown-num{
  font-size:clamp(80px,20vw,140px);font-family:Georgia,serif;font-style:italic;
  color:rgba(255,255,255,0.85);
  text-shadow:0 0 40px rgba(255,255,255,0.15);
  transition:opacity 0.4s;
}
</style>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.js"></script>

<body>

<!-- START -->
<div id="start-overlay">
  <p class="s-label">Mestni gozd Celje</p>
  <p class="s-title">Akumulacija<br>tišine</p>
  <p class="s-sub">Living Museum of Plant Intelligence</p>
  <button id="start-btn">▶ &nbsp; ZAČNI</button>
</div>

<!-- PHASE 1 -->
<div id="phase-breath">
  <p class="b-label">Mestni gozd Celje</p>
  <canvas id="breath-canvas" width="280" height="280"></canvas>
  <p id="breath-instr">vdihni počasi</p>
  <div id="breath-dots">
    <div class="bdot" id="d0"></div>
    <div class="bdot" id="d1"></div>
    <div class="bdot" id="d2"></div>
    <div class="bdot" id="d3"></div>
    <div class="bdot" id="d4"></div>
  </div>
</div>

<!-- PHASE 2+3 -->
<div id="phase-ar">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="cv-main"></canvas>
  <canvas id="cv-vasc"></canvas>

  <div id="hud-tl" class="hud">
    <div><span class="hl">SOLAR</span><span id="v-rad" class="dv-sun">—</span></div>
    <div><span class="hl">HUMID</span><span id="v-hum" class="dv-water">—</span></div>
    <div><span class="hl">TEMP</span><span id="v-tmp" class="dv-heat">—</span></div>
    <div><span class="hl">WIND</span><span id="v-wnd" class="dv-wind">—</span></div>
  </div>
  <div id="hud-tr" class="hud">
    <div>TREE_01</div>
    <div style="font-style:italic;font-family:Georgia,serif;font-size:11px;color:rgba(255,255,255,0.18)">Picea abies</div>
    <div id="v-time" style="margin-top:6px;font-size:9px;color:rgba(255,255,255,0.15)"></div>
  </div>
  <div id="hud-bl" class="hud">46°13′38″N · 15°15′33″E<br>AKUMULACIJA TIŠINE — 2026</div>

  <div id="sci-panel">
    <div id="sci-main"></div>
    <div id="sci-sub"></div>
  </div>


</div>

<!-- PHASE 4 -->
<div id="phase-text">
  <p class="poem-line" id="pl0">tišina je tukaj</p>
  <p class="poem-line" id="pl1">pusti telefon</p>
  <p class="poem-line" id="pl2">se dotakni</p>
  <p class="poem-line" id="pl3">drevo te čaka</p>
</div>

<div id="countdown-wrap">
  <div id="cdown-prompt">
    <span>imaš 10 sekund</span>
    <span>nato položi</span>
  </div>
  <div id="cdown-num">10</div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
const LAT=46.227222,LON=15.259167;
const TOTAL_BREATHS=5;
const BREATH_SEC=5;


// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let W=window.innerWidth,H=window.innerHeight;
let weather={temp:14,humidity:65,radiation:180,wind:1.8,soilMoisture:0.3,evapotranspiration:2.5,vpd:0.8};
let phase=0;

// breath
let audioCtx,analyser,micBuf;
let breathCount=0,breathPhase='in',breathTick=BREATH_SEC;
let breathActive=false;
let orbR=75,orbTarget=75,orbSmooth=0;
let breathNoise=Array.from({length:64},()=>Math.random()*Math.PI*2);
let breathAngle=0;

// ar
let sunP=[],waterP=[],heatP=[],windP=[],floats=[];
// mindar
let markerVisible=false;
let markerScreen={x:0,y:0};
let markerLockParticles=[];
let arMarkerEl=null; // global ref for polling


// ═══════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════
const bcv=document.getElementById('breath-canvas');
const bctx=bcv.getContext('2d');
const mcv=document.getElementById('cv-main');
const mctx=mcv.getContext('2d');
const vcv=document.getElementById('cv-vasc');
const vctx=vcv.getContext('2d');

function resizeAll(){
  W=mcv.width=vcv.width=window.innerWidth;
  H=mcv.height=vcv.height=window.innerHeight;
}
window.addEventListener('resize',resizeAll);
resizeAll();

// ═══════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════
document.getElementById('start-btn').addEventListener('click',async()=>{
  const ov=document.getElementById('start-overlay');
  ov.classList.add('out');
  setTimeout(()=>ov.style.display='none',900);
  // テスト用：深呼吸スキップ → 直接AR
  await goToAR();
  // 本番に戻す場合は上の行を下に変更：
  // await startBreath();
});

// ═══════════════════════════════════════════════
// PHASE 1 — BREATH
// ═══════════════════════════════════════════════
async function startBreath(){
  phase=1;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')await audioCtx.resume();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=1024;
    analyser.smoothingTimeConstant=0.8;
    const src=audioCtx.createMediaStreamSource(stream);
    src.connect(analyser);
    micBuf=new Uint8Array(analyser.frequencyBinCount);
  }catch(e){analyser=null;}

  breathActive=true;
  breathPhase='in';
  breathTick=BREATH_SEC;
  updateDots();
  requestAnimationFrame(breathLoop);

  // countdown ticker
  const iv=setInterval(()=>{
    if(phase!==1||!breathActive){clearInterval(iv);return;}
    breathTick--;
    if(breathTick<=0){
      if(breathPhase==='in'){
        breathPhase='out';
        breathTick=BREATH_SEC;
        document.getElementById('breath-instr').textContent='izdihni počasi';
      } else {
        breathPhase='in';
        breathTick=BREATH_SEC;
        breathCount++;
        updateDots();
        document.getElementById('breath-instr').textContent='vdihni počasi';
        if(breathCount>=TOTAL_BREATHS){
          breathActive=false;
          clearInterval(iv);
          setTimeout(goToAR,600);
        }
      }
    }
  },1000);
}

function getMicVol(){
  if(!analyser)return 0.1+Math.sin(Date.now()/800)*0.08;
  analyser.getByteFrequencyData(micBuf);
  // use full spectrum with higher sensitivity
  let sum=0;
  for(let i=1;i<micBuf.length;i++) sum+=micBuf[i];
  const avg=sum/(micBuf.length*255);
  return Math.min(1, avg*4.5); // boost sensitivity
}

function updateDots(){
  for(let i=0;i<5;i++){
    const d=document.getElementById('d'+i);
    d.className='bdot'+(i<breathCount?' done':i===breathCount?' active':'');
  }
}

function breathLoop(){
  if(phase!==1){return;}
  requestAnimationFrame(breathLoop);

  const vol=getMicVol();
  orbSmooth=orbSmooth*0.88+vol*0.12;

  const boost=breathPhase==='in'?1.0:-0.35;
  orbTarget=62+(orbSmooth*115)+(boost*20);
  orbR+=(orbTarget-orbR)*0.055;

  const cx=140,cy=140;
  bctx.clearRect(0,0,280,280);
  breathAngle+=0.013;
  for(let i=0;i<breathNoise.length;i++) breathNoise[i]+=0.0035;

  const pts=64;
  const noiseAmt=4+orbSmooth*22;

  // glow rings — green
  for(let ring=3;ring>0;ring--){
    const gr=bctx.createRadialGradient(cx,cy,0,cx,cy,orbR+ring*16);
    gr.addColorStop(0,'rgba(0,0,0,0)');
    gr.addColorStop(0.5,'rgba(0,0,0,0)');
    gr.addColorStop(1,`rgba(74,255,106,${0.02*ring*(orbSmooth*3+0.5)})`);
    bctx.beginPath();
    for(let i=0;i<=pts;i++){
      const a=(i/pts)*Math.PI*2;
      const ni=Math.floor((i/pts)*breathNoise.length)%breathNoise.length;
      const n=Math.sin(breathNoise[ni]+breathAngle*2.2)*noiseAmt*ring*0.35;
      const r=orbR+ring*16+n;
      const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      i===0?bctx.moveTo(x,y):bctx.lineTo(x,y);
    }
    bctx.closePath();bctx.fillStyle=gr;bctx.fill();
  }

  // main blob — green
  bctx.beginPath();
  for(let i=0;i<=pts;i++){
    const a=(i/pts)*Math.PI*2;
    const ni=Math.floor((i/pts)*breathNoise.length)%breathNoise.length;
    const n=Math.sin(breathNoise[ni]+breathAngle*1.6)*noiseAmt
           +Math.cos(breathNoise[(ni+16)%breathNoise.length]+breathAngle*0.85)*noiseAmt*0.38;
    const r=orbR+n;
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    i===0?bctx.moveTo(x,y):bctx.lineTo(x,y);
  }
  bctx.closePath();
  const gMain=bctx.createRadialGradient(cx-8,cy-8,2,cx,cy,orbR+noiseAmt);
  gMain.addColorStop(0,`rgba(160,255,170,${0.6+orbSmooth*0.3})`);
  gMain.addColorStop(0.5,`rgba(74,200,90,${0.3+orbSmooth*0.2})`);
  gMain.addColorStop(1,'rgba(20,80,30,0.05)');
  bctx.fillStyle=gMain;bctx.fill();
  bctx.strokeStyle=`rgba(100,255,120,${0.4+orbSmooth*0.45})`;
  bctx.lineWidth=1;bctx.stroke();
}

// ═══════════════════════════════════════════════
// TRANSITION → AR
// ═══════════════════════════════════════════════
async function goToAR(){
  phase=2;
  document.getElementById('phase-breath').classList.add('out');
  document.getElementById('phase-breath').style.display='none';

  document.getElementById('video').style.display='none';

  // show waiting screen while permission dialogs resolve
  const waitEl=document.createElement('div');
  waitEl.style.cssText='position:fixed;inset:0;z-index:300;background:#000;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:0.3em;color:rgba(255,255,255,0.4);';
  waitEl.textContent='INITIALIZING CAMERA...';
  document.body.appendChild(waitEl);

  // init AR.js — triggers camera permission dialog
  initARjs();

  // wait until AR.js camera video is actually streaming
  await new Promise(resolve=>{
    const check=setInterval(()=>{
      // AR.js may place video in body or inside a-scene
      const videos=[...document.querySelectorAll('video')];
      const camVid=videos.find(v=>v.id!=='ar-vessel'&&v.readyState>=2&&v.videoWidth>0);
      if(camVid){clearInterval(check);resolve();}
    },200);
    setTimeout(()=>{clearInterval(check);resolve();},8000);
  });

  waitEl.remove();

  await fetchWeather();
  buildParticles();
  floats=Array.from({length:18},()=>{const f=new FloatNum();f.life=Math.random()*f.maxLife;return f;});

  document.getElementById('phase-ar').classList.add('visible');
  requestAnimationFrame(arLoop);

  setTimeout(()=>document.getElementById('hud-tl').classList.add('show'),400);
  setTimeout(()=>document.getElementById('hud-tr').classList.add('show'),700);
  setTimeout(()=>document.getElementById('hud-bl').classList.add('show'),1100);
  setTimeout(showSciData,1500);
  setTimeout(startGlitch,6000);
}

// ═══════════════════════════════════════════════
// WEATHER
// ═══════════════════════════════════════════════
async function fetchWeather(){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,direct_radiation,vapour_pressure_deficit&hourly=soil_moisture_0_to_1cm,evapotranspiration&timezone=auto&forecast_days=1`);
    const d=await r.json();const c=d.current;
    // hourly: find closest hour index
    const now=new Date();
    const hIdx=now.getHours();
    const sm=d.hourly?.soil_moisture_0_to_1cm?.[hIdx]??0.3;
    const et=d.hourly?.evapotranspiration?.[hIdx]??2.5;
    weather={
      temp:c.temperature_2m??14,
      humidity:c.relative_humidity_2m??65,
      radiation:c.direct_radiation??180,
      wind:c.wind_speed_10m??1.8,
      soilMoisture:sm,          // 0–0.5 m³/m³
      evapotranspiration:et,    // mm/h (positive = loss)
      vpd:c.vapour_pressure_deficit??0.8  // kPa: low=wet, high=stress
    };
  }catch(e){}
  updateHUD();
}
function updateHUD(){
  document.getElementById('v-rad').textContent=weather.radiation.toFixed(1)+' W/m²';
  document.getElementById('v-hum').textContent=weather.humidity.toFixed(0)+'%';
  document.getElementById('v-tmp').textContent=weather.temp.toFixed(1)+'°C';
  document.getElementById('v-wnd').textContent=weather.wind.toFixed(1)+' m/s';
  document.getElementById('v-time').textContent=new Date().toTimeString().slice(0,8);
}
setInterval(()=>{if(phase>=2)updateHUD();},1000);
setInterval(()=>{if(phase>=2)fetchWeather();},60000);

// science data calculation
function showSciData(){
  // photosynthesis: rough estimate based on radiation + humidity
  const rad=weather.radiation;
  const hum=weather.humidity;
  const tmp=weather.temp;

  // CO2 absorbed today (simplified: 8h daylight, radiation scaling)
  const hoursLight=Math.max(0,Math.min(10,(rad/500)*10));
  const co2PerHour=6+(rad/500)*5+(hum/100)*2;
  const co2Today=(co2PerHour*hoursLight*0.7).toFixed(1);

  // water potential (MPa) — more negative when dry/hot
  const psi=(-0.8-(tmp/30)*0.6-(1-hum/100)*0.8).toFixed(2);

  // flow rate estimate
  const flowRate=(15+(rad/500)*35+(hum/100)*20).toFixed(0);

  document.getElementById('sci-main').textContent=
    `danes je to drevo absorbiralo ${co2Today} kg CO₂`;
  document.getElementById('sci-sub').textContent=
    `vodni potencial ${psi} MPa  ·  tok ${flowRate} ml/h  ·  sevanje ${rad.toFixed(0)} W/m²`;

  document.getElementById('sci-panel').classList.add('show');
}

// ═══════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════
class Particle{
  constructor(c){this.cfg=c;this.reset();}
  reset(){
    const c=this.cfg;
    this.x=W*(c.xMin+Math.random()*(c.xMax-c.xMin));
    this.y=H*(0.05+Math.random()*0.9);
    const wf=weather.wind/10;
    this.vx=c.vxBase+(Math.random()-0.5)*c.vxSpread+wf*(c.wd||0);
    this.vy=c.vyBase-Math.random()*c.vyRange;
    this.size=c.sMin+Math.random()*c.sRange;
    this.maxLife=Math.floor(c.lMin+Math.random()*c.lRange);
    this.life=Math.random()*this.maxLife;
    this.r=c.r;this.g=c.g;this.b=c.b;this.op=c.op;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.life--;if(this.life<=0||this.x<-20||this.x>W+20||this.y<-20)this.reset();}
  draw(){
    const f=this.life/this.maxLife<0.12?(this.life/this.maxLife)/0.12:1;
    mctx.beginPath();mctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    mctx.fillStyle=`rgba(${this.r},${this.g},${this.b},${this.op*f})`;mctx.fill();
  }
}
function buildParticles(){
  const rad=Math.max(0.1,weather.radiation/500);
  const hum=weather.humidity/100;
  const tmp=Math.max(0.1,(weather.temp+10)/45);
  const wnd=Math.max(0.1,weather.wind/15);
  sunP=Array.from({length:Math.floor(38+rad*55)},()=>new Particle({r:255,g:210,b:60,xMin:0.1,xMax:0.9,vxBase:0,vxSpread:0.6,wd:0.3,vyBase:0.55*rad,vyRange:0.75*rad,sMin:1.2,sRange:2.8,lMin:120,lRange:160,op:0.6+rad*0.3}));
  waterP=Array.from({length:Math.floor(28+hum*45)},()=>new Particle({r:80,g:190,b:255,xMin:0,xMax:1,vxBase:0.2,vxSpread:0.8,wd:0.5,vyBase:0.15*hum,vyRange:0.25,sMin:1,sRange:2.2,lMin:180,lRange:200,op:0.4+hum*0.45}));
  heatP=Array.from({length:Math.floor(18+tmp*38)},()=>new Particle({r:255,g:90,b:40,xMin:0.2,xMax:0.8,vxBase:0,vxSpread:0.5,wd:0,vyBase:0.75*tmp,vyRange:0.55*tmp,sMin:0.6,sRange:1.6,lMin:80,lRange:120,op:0.5+tmp*0.35}));
  windP=Array.from({length:Math.floor(14+wnd*32)},()=>new Particle({r:255,g:255,b:255,xMin:-0.1,xMax:0.6,vxBase:1.1*wnd,vxSpread:0.4,wd:1,vyBase:0.05,vyRange:0.3,sMin:0.5,sRange:1.3,lMin:100,lRange:150,op:0.3+wnd*0.45}));
}

class FloatNum{
  constructor(){this.spawn();}
  spawn(){
    const pool=[
      {t:weather.temp.toFixed(4),col:'255,90,40'},
      {t:weather.humidity.toFixed(4),col:'80,190,255'},
      {t:weather.radiation.toFixed(4),col:'255,210,60'},
      {t:weather.wind.toFixed(4),col:'255,255,255'},
      {t:(Math.random()*0.01).toFixed(6),col:'200,255,210'},
    ];
    const p=pool[Math.floor(Math.random()*pool.length)];
    this.text=p.t;this.col=p.col;
    this.x=Math.random()*W;this.y=H*(0.1+Math.random()*0.8);
    this.vy=-(0.05+Math.random()*0.14);
    this.life=Math.floor(160+Math.random()*260);this.maxLife=this.life;
    this.sz=9+Math.floor(Math.random()*4);
  }
  update(){this.y+=this.vy;this.life--;if(this.life<=0||this.y<-20)this.spawn();}
  draw(){
    const r=this.life/this.maxLife;
    const f=r<0.08?r/0.08:r>0.9?(1-r)/0.1:1;
    mctx.font=`${this.sz}px 'Courier New',monospace`;
    mctx.shadowColor='rgba(0,0,0,0.9)';mctx.shadowBlur=7;
    mctx.fillStyle=`rgba(${this.col},${0.55*f})`;
    mctx.fillText(this.text,this.x,this.y);
    mctx.shadowBlur=0;
  }
}

// ═══════════════════════════════════════════════
// AR LOOP
// ═══════════════════════════════════════════════
function arLoop(){
  if(phase<2)return;
  requestAnimationFrame(arLoop);

  // ── marker visibility polling ──
  if(!arMarkerEl) arMarkerEl=document.querySelector('a-marker');
  const nowVisible=!!(arMarkerEl&&arMarkerEl.object3D&&arMarkerEl.object3D.visible);
  if(nowVisible&&!markerVisible){
    // just found
    markerVisible=true;
    const vid=document.getElementById('ar-vessel');
    if(vid)vid.play().catch(()=>{});
    if(!markerLockParticles.length)
      markerLockParticles=Array.from({length:40},()=>new LockedParticle());
    spawnVNets();
  } else if(!nowVisible&&markerVisible){
    // just lost
    markerVisible=false;
    markerLockParticles=[];
    clearVNets();
  }

  mctx.clearRect(0,0,W,H);

  [...sunP,...waterP,...heatP,...windP].forEach(p=>{p.update();p.draw();});
  floats.forEach(f=>{f.update();f.draw();});
  if(markerVisible){markerLockParticles.forEach(p=>{p.update();p.draw();});}
  tickVascular();
}

function startGlitch(){
  phase=3;
}


// ═══════════════════════════════════════════════
// VASCULAR NETWORK
// ═══════════════════════════════════════════════
const VNET_COLORS=['255,246,0','49,225,247','216,0,166','255,255,255'];
let vNets=[];

class VNet{
  constructor(block,color){
    this.block=block;
    this.color=color||'160,238,255';
    this.edges=[];
    this.pulses=[];
    this.age=0;
    this.maxAge=Math.floor(200+Math.random()*180);
    this._grow();
  }
  _grow(){
    const{dx:bx,dy:by,dw:bw,dh:bh}=this.block;
    const root={x:bx+bw*0.2+Math.random()*bw*0.6,y:by+bh*0.92};
    const grow=(node,dir,depth,maxD)=>{
      if(depth>=maxD)return;
      const branches=depth<2?2:Math.random()<0.5?2:1;
      for(let b=0;b<branches;b++){
        const ang=dir+(Math.random()-0.5)*(depth<2?0.45:0.75);
        const len=bh*(0.14+Math.random()*0.18)/(depth*0.4+1);
        const child={x:node.x+Math.sin(ang)*len,y:node.y-Math.cos(ang)*len};
        const w=Math.max(0.3,1.9-depth*0.3);
        this.edges.push({from:node,to:child,w,depth});
        grow(child,ang,depth+1,maxD);
      }
    };
    grow(root,0,0,6);
    this._pulse();this._pulse();this._pulse();
  }
  _pulse(){
    if(!this.edges.length)return;
    const ei=Math.floor(Math.random()*this.edges.length);
    this.pulses.push({ei,t:0,spd:0.012+Math.random()*0.018});
  }
  update(){
    this.age++;
    for(let i=this.pulses.length-1;i>=0;i--){
      this.pulses[i].t+=this.pulses[i].spd;
      if(this.pulses[i].t>1)this.pulses.splice(i,1);
    }
    if(Math.random()<0.08)this._pulse();
  }
  _drawEdges(ctx,baseA){
    for(const e of this.edges){
      const ea=baseA*(1-e.depth*0.09);
      ctx.save();
      ctx.strokeStyle=`rgba(160,238,255,${ea*0.65})`;
      ctx.lineWidth=e.w;
      ctx.shadowColor='rgba(140,230,255,0.95)';
      ctx.shadowBlur=3+e.w*2.5;
      ctx.beginPath();ctx.moveTo(e.from.x,e.from.y);ctx.lineTo(e.to.x,e.to.y);ctx.stroke();
      ctx.restore();
    }
  }
  _drawPulses(ctx,baseA){
    const col=this.color;
    for(const p of this.pulses){
      const e=this.edges[p.ei];if(!e)continue;
      const px=e.from.x+(e.to.x-e.from.x)*p.t;
      const py=e.from.y+(e.to.y-e.from.y)*p.t;
      const pr=1.8+e.w;
      ctx.save();
      const g=ctx.createRadialGradient(px,py,0,px,py,pr*3.5);
      g.addColorStop(0,`rgba(255,255,255,${baseA*0.95})`);
      g.addColorStop(0.35,`rgba(${col},${baseA*0.55})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(px,py,pr*3.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(${col},${baseA})`;
      ctx.beginPath();ctx.arc(px,py,pr*0.5,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }
  draw(globalA){
    if(globalA<=0)return;
    const lr=this.age/this.maxAge;
    const fade=lr<0.08?lr/0.08:lr>0.8?(1-lr)/0.2:1;
    const baseA=fade*globalA;
    this._drawEdges(vctx,baseA);
    this._drawPulses(vctx,baseA);
  }
  get dead(){return this.age>=this.maxAge;}
}

function spawnVNets(){
  const mx=markerScreen.x||W/2, my=markerScreen.y||H/2;
  const count=8+Math.floor(Math.random()*3);
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2;
    const r=150+Math.random()*150;
    const cx=mx+Math.cos(ang)*r;
    const cy=my+Math.sin(ang)*r;
    const sz=80+Math.random()*60;
    const block={dx:cx-sz/2,dy:cy-sz/2,dw:sz,dh:sz};
    vNets.push(new VNet(block,VNET_COLORS[i%VNET_COLORS.length]));
  }
}

function clearVNets(){
  vNets=[];
}

function tickVascular(){
  vctx.clearRect(0,0,W,H);
  for(let i=vNets.length-1;i>=0;i--){
    vNets[i].update();
    vNets[i].draw(1);
    if(vNets[i].dead)vNets.splice(i,1);
  }
  if(markerVisible&&vNets.length<1) spawnVNets();
}



// ═══════════════════════════════════════════════
// MINDAR
// ═══════════════════════════════════════════════

class LockedParticle{
  constructor(){this.reset();}
  reset(){
    const ang=Math.random()*Math.PI*2;
    const r=20+Math.random()*55;
    this.x=markerScreen.x+Math.cos(ang)*r;
    this.y=markerScreen.y+Math.sin(ang)*r;
    this.vx=(Math.random()-0.5)*0.7;
    this.vy=-(0.2+Math.random()*0.7);
    this.size=0.8+Math.random()*2.5;
    this.life=Math.floor(80+Math.random()*120);
    this.maxLife=this.life;
    const cols=[[74,255,106],[160,238,255],[255,210,60],[200,255,210]];
    const c=cols[Math.floor(Math.random()*cols.length)];
    this.r=c[0];this.g=c[1];this.b=c[2];
  }
  update(){
    const dx=markerScreen.x-this.x,dy=markerScreen.y-this.y;
    this.x+=this.vx+dx*0.004;
    this.y+=this.vy+dy*0.004;
    this.life--;
    if(this.life<=0)this.reset();
  }
  draw(){
    const f=this.life/this.maxLife<0.15?(this.life/this.maxLife)/0.15:1;
    mctx.beginPath();mctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    mctx.fillStyle=`rgba(${this.r},${this.g},${this.b},${0.75*f})`;mctx.fill();
  }
}



function initARjs(){
  const sceneEl=document.createElement('a-scene');
  sceneEl.setAttribute('embedded','');
  sceneEl.setAttribute('arjs','sourceType: webcam; debugUIEnabled: false; uiScanning: no; uiError: no; uiLoading: no; patternRatio: 0.5;');
  sceneEl.setAttribute('renderer','alpha:true;logarithmicDepthBuffer:true;');
  sceneEl.setAttribute('vr-mode-ui','enabled:false');
  sceneEl.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:2;pointer-events:none;background:transparent;';

  const assets=document.createElement('a-assets');
  const vid=document.createElement('video');
  vid.id='ar-vessel';vid.src='vessel.mp4';
  vid.setAttribute('loop','true');vid.setAttribute('crossorigin','anonymous');
  vid.setAttribute('playsinline','');vid.setAttribute('webkit-playsinline','');
  vid.muted=true;
  assets.appendChild(vid);sceneEl.appendChild(assets);

  const marker=document.createElement('a-marker');
  marker.setAttribute('preset','hiro');
  arMarkerEl=marker;

  // vessel video on 4 sides around marker, hidden until found
  const positions=[
    {pos:'-2.2 0.05 0', rot:'-90 0 0'},
    {pos:'2.2 0.05 0',  rot:'-90 0 0'},
    {pos:'0 0.05 -2.2', rot:'-90 0 0'},
    {pos:'0 0.05 2.2',  rot:'-90 0 0'},
  ];
  const planes=positions.map(p=>{
    const pl=document.createElement('a-video');
    pl.setAttribute('src','#ar-vessel');
    pl.setAttribute('width','1.6');pl.setAttribute('height','1.0');
    pl.setAttribute('position',p.pos);pl.setAttribute('rotation',p.rot);
    pl.setAttribute('visible','false');
    marker.appendChild(pl);
    return pl;
  });

  marker.addEventListener('markerFound',()=>{
    markerVisible=true;
    vid.play().catch(()=>{});
    planes.forEach(pl=>pl.setAttribute('visible','true'));
  });
  marker.addEventListener('markerLost',()=>{
    markerVisible=false;
    planes.forEach(pl=>pl.setAttribute('visible','false'));
  });

  sceneEl.appendChild(marker);

  const camEnt=document.createElement('a-entity');
  camEnt.setAttribute('camera','');sceneEl.appendChild(camEnt);
  document.body.appendChild(sceneEl);

  // kill AR.js hiro download popup safely
  const popupKiller=new MutationObserver(()=>{
    document.querySelectorAll('body > div').forEach(d=>{
      if(d.id||d.classList.length)return; // skip our own divs
      const bg=window.getComputedStyle(d).backgroundColor;
      if(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent'){
        d.remove();
      }
    });
  });
  popupKiller.observe(document.body,{childList:true});

  // ── real marker screen position via RAF polling ──
  function updateMarkerScreenPos(){
    const T=window.THREE||window.AFRAME&&AFRAME.THREE;
    if(T&&marker.object3D&&camEnt.object3D){
      const mPos=new T.Vector3();
      marker.object3D.getWorldPosition(mPos);
      const cam=camEnt.getObject3D('camera');
      if(cam){
        const projected=mPos.clone().project(cam);
        const nx=(projected.x+1)/2;
        const ny=(-projected.y+1)/2;
        if(markerVisible&&nx>-0.2&&nx<1.2&&ny>-0.2&&ny<1.2){
          markerScreen.x=nx*W;
          markerScreen.y=ny*H;
        }
      }
    }
    requestAnimationFrame(updateMarkerScreenPos);
  }
  sceneEl.addEventListener('loaded',()=>{
    updateMarkerScreenPos();
    // style camera feed
    const camStyle='position:fixed;top:50%;left:50%;min-width:100vw;min-height:100vh;width:auto;height:auto;transform:translate(-50%,-50%);object-fit:cover;opacity:1;filter:none;z-index:1;pointer-events:none;';
    document.querySelectorAll('body > video').forEach(v=>{
      if(v.id==='ar-vessel')return;
      v.style.cssText=camStyle;
    });
  });

  const camStyle2='position:fixed;top:50%;left:50%;min-width:100vw;min-height:100vh;width:auto;height:auto;transform:translate(-50%,-50%);object-fit:cover;opacity:1;filter:none;z-index:1;pointer-events:none;';
  const obs=new MutationObserver(()=>{
    document.querySelectorAll('body > video').forEach(v=>{
      if(v.id==='ar-vessel')return;
      v.style.cssText=camStyle2;
    });
  });
  obs.observe(document.body,{childList:true,subtree:false});

  // marker visibility is handled by polling in arLoop
}

// PHASE 4 — POEM + COUNTDOWN
// ═══════════════════════════════════════════════
function startText(){
  phase=4;

  const pt=document.getElementById('phase-text');
  pt.classList.add('visible');

  // poem lines
  ['pl0','pl1','pl2','pl3'].forEach((id,i)=>{
    setTimeout(()=>document.getElementById(id).classList.add('show'),500+i*900);
  });

  // after poem: fade out → countdown
  setTimeout(()=>{
    pt.style.opacity='0';
    setTimeout(startCountdown,1500);
  },5500);
}

function startCountdown(){
  const cw=document.getElementById('countdown-wrap');
  const cn=document.getElementById('cdown-num');
  cw.classList.add('visible');

  let n=10;
  cn.textContent=n;

  const iv=setInterval(()=>{
    n--;
    cn.style.opacity='0';
    setTimeout(()=>{
      cn.textContent=n;
      cn.style.opacity='1';
    },200);
    if(n<=0){
      clearInterval(iv);
      setTimeout(()=>{
        cw.style.opacity='0';
        document.getElementById('phase-ar').style.opacity='0';
        document.getElementById('video').style.opacity='0';
      },500);
    }
  },1000);
}
