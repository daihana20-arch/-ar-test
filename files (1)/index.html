
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AR Test</title>
  <style>
    body { margin: 0; background: #000; color: white; font-family: sans-serif; }
    #info { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 16px; z-index: 999; white-space: nowrap; font-size:13px; }
  </style>
</head>
<body>
  <div id="info">読み込み中...</div>
  <script>
    var s1 = document.createElement('script');
    s1.src = 'https://aframe.io/releases/1.4.0/aframe.min.js';
    s1.onload = function() {
      document.getElementById('info').textContent = 'A-Frame OK、AR.js読み込み中...';
      var s2 = document.createElement('script');
      s2.src = 'https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js';
      s2.onload = function() {
        document.getElementById('info').textContent = 'マーカーにカメラを向けてください';
        var scene = document.createElement('a-scene');
        scene.setAttribute('embedded', '');
        scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false;');
        scene.setAttribute('vr-mode-ui', 'enabled: false');
        scene.innerHTML = '<a-marker type="pattern" url="pattern-pattern-Planet-A-square.patt"><a-box position="0 0.5 0" color="red" scale="0.5 0.5 0.5"></a-box></a-marker><a-entity camera></a-entity>';
        document.body.appendChild(scene);
      };
      s2.onerror = function() { document.getElementById('info').textContent = 'AR.js読み込み失敗'; };
      document.head.appendChild(s2);
    };
    s1.onerror = function() { document.getElementById('info').textContent = 'A-Frame読み込み失敗'; };
    document.head.appendChild(s1);
  </script>
</body>
</html>
