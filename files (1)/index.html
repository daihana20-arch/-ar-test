<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AR — Planet Intelligence v4</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #info {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white;
      font-family: sans-serif; font-size: 13px;
      padding: 8px 14px; border-radius: 16px;
      z-index: 999; pointer-events: none;
      white-space: nowrap;
    }
  </style>

  <script>
  AFRAME.registerComponent('lsystem-tree', {
    schema: {
      duration: { type: 'number', default: 6000  },
      maxdepth: { type: 'number', default: 5     },
      angle:    { type: 'number', default: 28    },
      length:   { type: 'number', default: 0.30  },
      color:    { type: 'color',  default: '#00ffcc' }
    },

    init: function () {
      this.segments  = [];
      this.meshes    = [];
      this.startTime = null;
      this.built     = false;

      const THREE = AFRAME.THREE;

      // 再帰的に3D木を構築
      this._buildTree(
        new THREE.Vector3(0, 0, 0),      // 根元（マーカー中心）
        new THREE.Vector3(0, 1, 0),      // 上向きスタート
        this.data.length,
        0.045,                            // 幹の半径(m)
        0
      );

      // 幹 → 太枝 → 細枝の順に成長させる
      this.segments.sort((a, b) => a.depth - b.depth);

      this._createMeshes();
    },

    /* ─── 再帰ツリー ─── */
    _buildTree: function (start, dir, len, radius, depth) {
      const THREE = AFRAME.THREE;
      if (depth > this.data.maxdepth || len < 0.005) return;

      const end = start.clone().addScaledVector(dir, len);
      this.segments.push({
        start:  start.clone(),
        end:    end.clone(),
        radius: radius,
        depth:  depth
      });

      if (depth === this.data.maxdepth) return;

      const bAngle   = this.data.angle * Math.PI / 180;
      const branches = (depth === 0) ? 3 : 2;   // 幹は3方向、以降2方向

      // dir に垂直なベクトルを求める
      let up = new THREE.Vector3(0, 1, 0);
      if (Math.abs(dir.dot(up)) > 0.9)
        up = new THREE.Vector3(1, 0, 0);
      const perp = new THREE.Vector3().crossVectors(dir, up).normalize();

      for (let i = 0; i < branches; i++) {
        // 黄金角オフセットで枝が重ならないように
        const azimuth = (i / branches) * Math.PI * 2 + depth * 2.399;
        const rotPerp = perp.clone().applyAxisAngle(dir, azimuth);
        const newDir  = dir.clone().applyAxisAngle(rotPerp, bAngle).normalize();

        this._buildTree(
          end.clone(),
          newDir,
          len    * 0.70,
          radius * 0.65,
          depth + 1
        );
      }
    },

    /* ─── メッシュ生成 ─── */
    _createMeshes: function () {
      const THREE  = AFRAME.THREE;
      const color  = new THREE.Color(this.data.color);
      const Y_AXIS = new THREE.Vector3(0, 1, 0);

      this.meshes = this.segments.map(seg => {
        const { start, end, radius } = seg;
        const segLen = start.distanceTo(end);
        if (segLen < 0.001) return null;

        // 底面を原点に置いた円柱
        const geo = new THREE.CylinderGeometry(
          radius * 0.70, radius, segLen, 8, 1
        );
        geo.translate(0, segLen / 2, 0);

        // 発光ルック（ライト不要）
        const mat = new THREE.MeshBasicMaterial({
          color:       color,
          transparent: true,
          opacity:     0
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(start);

        // start → end 方向に向ける
        const dir = end.clone().sub(start).normalize();
        if (Math.abs(dir.dot(Y_AXIS)) < 0.9999)
          mesh.quaternion.setFromUnitVectors(Y_AXIS, dir);

        mesh.scale.y = 0.001;
        this.el.object3D.add(mesh);
        return { mesh, seg };
      }).filter(Boolean);
    },

    /* ─── アニメーション ─── */
    tick: function (time) {
      if (!this.startTime) this.startTime = time;

      const elapsed  = time - this.startTime;
      const total    = this.meshes.length;
      const progress = Math.min(elapsed / this.data.duration, 1.0);
      const revealed = progress * total;

      if (progress < 1.0) {
        /* 成長フェーズ：根元から先端へ順に伸びる */
        for (let i = 0; i < total; i++) {
          const { mesh } = this.meshes[i];
          if (i < Math.floor(revealed)) {
            if (mesh.scale.y < 0.999) {
              mesh.scale.y = 1;
              mesh.material.opacity = 0.95;
              mesh.material.needsUpdate = true;
            }
          } else if (i < revealed) {
            const t = revealed - Math.floor(revealed);
            mesh.scale.y = Math.max(t, 0.001);
            mesh.material.opacity = 0.95 * t;
            mesh.material.needsUpdate = true;
          }
        }
      } else {
        /* パルスフェーズ：生長完了後にグロー点滅 */
        if (!this.built) {
          this.meshes.forEach(({ mesh }) => {
            mesh.scale.y = 1;
            mesh.material.opacity = 0.95;
            mesh.material.needsUpdate = true;
          });
          this.built = true;
        }
        const pulse = Math.sin(time * 0.0012) * 0.20 + 0.78;
        this.meshes.forEach(({ mesh }) => {
          mesh.material.opacity = pulse;
          mesh.material.needsUpdate = true;
        });
      }
    },

    remove: function () {
      this.meshes.forEach(({ mesh }) => {
        this.el.object3D.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.dispose();
      });
    }
  });
  </script>
</head>
<body>
  <div id="info">マーカーにカメラを向けてください</div>
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;">
    <a-marker type="pattern" url="pattern-pattern-Planet-A-square.patt">
      <a-entity
        lsystem-tree="duration:6000; maxdepth:5; angle:28; length:0.30; color:#00ffcc"
        position="0 0 0">
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
