<script>
const LAT=46.227222, LON=15.259167;
let W=window.innerWidth, H=window.innerHeight;
let markerSeen=false, phActive=false, phAlpha=0, phase=0, tick=0;
let weather={temp:14,humidity:65,radiation:180,wind:1.8,soilMoisture:0.3,vpd:0.8};

const phCv=document.getElementById('ph-cv');
const phCtx=phCv.getContext('2d');
function resize(){W=phCv.width=window.innerWidth;H=phCv.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);

const FADE_IN=0.008, FADE_OUT=0.015;

/* ── Particle Engine ── */
const PI=Math.PI, TAU=PI*2;
const attractors=[
  {x:0.3,y:0.4,freq:0.007,phase:0},
  {x:0.7,y:0.6,freq:0.011,phase:2.1},
  {x:0.5,y:0.2,freq:0.005,phase:4.3},
  {x:0.2,y:0.7,freq:0.009,phase:1.1},
  {x:0.8,y:0.3,freq:0.013,phase:3.7},
];

class Particle {
  constructor(ax,ay,hue){
    this.x=ax+(Math.random()-0.5)*60;
    this.y=ay+(Math.random()-0.5)*60;
    this.vx=(Math.random()-0.5)*0.8;
    this.vy=(Math.random()-0.5)*0.8;
    this.hue=hue+Math.random()*40-20;
    this.life=0.7+Math.random()*0.3;
    this.decay=0.003+Math.random()*0.002;
    this.wobble=Math.random()*TAU;
    this.wobbleSpeed=(Math.random()-0.5)*0.06;
  }
  step(tick){
    const spd=8*0.015;
    this.wobble+=this.wobbleSpeed;
    const nx=Math.sin(this.x*0.008+tick*0.003)*Math.cos(this.y*0.006);
    const ny=Math.cos(this.x*0.006-tick*0.002)*Math.sin(this.y*0.008);
    this.vx+=nx*spd+Math.sin(this.wobble)*0.03;
    this.vy+=ny*spd+Math.cos(this.wobble)*0.03;
    this.vx*=0.97; this.vy*=0.97;
    this.x+=this.vx; this.y+=this.vy;
    this.life-=this.decay;
  }
  draw(ctx,tick){
    const a=Math.max(0,this.life);
    ctx.fillStyle=`hsla(${this.hue+tick*0.2},70%,65%,${a*0.55})`;
    ctx.beginPath();
    ctx.arc(this.x,this.y,Math.max(0.001,a*4),0,TAU);
    ctx.fill();
  }
}

const pools=attractors.map((a,i)=>({attractor:a,hue:i*72,particles:[]}));

function stepParticles(){
  phCtx.clearRect(0,0,W,H);
  if(phAlpha<=0) return;
  phCtx.save();
  phCtx.globalAlpha=phAlpha;
  tick++;

  for(const pool of pools){
    const a=pool.attractor;
    const ax=(a.x+Math.sin(tick*a.freq+a.phase)*0.18)*W;
    const ay=(a.y+Math.cos(tick*a.freq*0.7+a.phase)*0.14)*H;

    if(phAlpha>0.1 && pool.particles.length<120){
      for(let i=0;i<3;i++) pool.particles.push(new Particle(ax,ay,pool.hue));
    }

    pool.particles=pool.particles.filter(p=>p.life>0);
    for(const p of pool.particles){ p.step(tick); p.draw(phCtx,tick); }

    phCtx.strokeStyle=`hsla(${pool.hue+tick*0.2},60%,70%,0.08)`;
    phCtx.lineWidth=0.5;
    const pts=pool.particles;
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
        if(dx*dx+dy*dy<3600){
          phCtx.beginPath();
          phCtx.moveTo(pts[i].x,pts[i].y);
          phCtx.lineTo(pts[j].x,pts[j].y);
          phCtx.stroke();
        }
      }
    }
  }
  phCtx.restore();
}

/* ── Video + Canvas fullscreen fix（AR.jsのインライン上書き対策） ── */
function fixVideoSize(){
  // video：中央配置で全画面カバー
  document.querySelectorAll('video').forEach(v=>{
    if(v.id==='ar-vessel') return;
    v.style.setProperty('position','fixed','important');
    v.style.setProperty('top','50%','important');
    v.style.setProperty('left','50%','important');
    v.style.setProperty('min-width','100vw','important');
    v.style.setProperty('min-height','100vh','important');
    v.style.setProperty('width','auto','important');
    v.style.setProperty('height','auto','important');
    v.style.setProperty('transform','translate(-50%,-50%)','important');
    v.style.setProperty('object-fit','cover','important');
    v.style.setProperty('opacity','1','important');
    v.style.setProperty('filter','none','important');
    v.style.setProperty('z-index','0','important');
    v.style.setProperty('pointer-events','none','important');
  });
  // canvas：全画面固定
  document.querySelectorAll('canvas.a-canvas').forEach(c=>{
    c.style.setProperty('position','fixed','important');
    c.style.setProperty('top','0','important');
    c.style.setProperty('left','0','important');
    c.style.setProperty('width','100vw','important');
    c.style.setProperty('height','100vh','important');
  });
}
setInterval(fixVideoSize,300);
new MutationObserver(()=>fixVideoSize()).observe(document.body,{childList:true,subtree:true});

/* ── Mic ── */
let micAnalyser=null,micDataArr=null;
function getMicVolume(){
  if(!micAnalyser)return 0;
  micAnalyser.getByteFrequencyData(micDataArr);
  let s=0;for(let i=0;i<micDataArr.length;i++)s+=micDataArr[i];
  return Math.min(1,s/micDataArr.length/128);
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('bt-mic').addEventListener('click',async function(){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      const ac=new(window.AudioContext||window.webkitAudioContext)();
      const src=ac.createMediaStreamSource(stream);
      const an=ac.createAnalyser();an.fftSize=256;
      src.connect(an);
      micAnalyser=an;micDataArr=new Uint8Array(an.frequencyBinCount);
      this.textContent='[ MIC ON ]';this.classList.add('active');
    }catch(e){this.textContent='[ NO MIC ]';}
  });
});

/* ── Breathing Screen ── */
function runBreathing(onDone){
  const wrap=document.getElementById('p-breath');
  const glCv=document.getElementById('glCanvas');
  const arcCv=document.getElementById('arcCanvas');
  const numEl=document.getElementById('bt-num');
  const lblIn=document.getElementById('bt-vdihi');
  const lblEx=document.getElementById('bt-izdihi');
  const arcCtx=arcCv.getContext('2d');
  const S=260;

  /* WebGL */
  const gl=glCv.getContext('webgl');
  const VS=`attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0,1);}`;
  const FS=`precision mediump float;
uniform vec2 iResolution;uniform float iTime;uniform float iBreath;
float rand(float n){return fract(sin(n)*43758.5453123);}
float noise1D(float p){float fl=floor(p);float fc=fract(p);return(mix(rand(fl),rand(fl+1.0),fc)-.5)*2.;}
float perlin3(vec3 P){
  vec3 Pi=floor(P);vec3 Pf=P-Pi;vec3 Pf1=Pf-1.0;
  Pi.xyz=Pi.xyz-floor(Pi.xyz*(1.0/69.0))*69.0;
  vec3 Pi1=step(Pi,vec3(67.5))*(Pi+1.0);
  vec4 Pt=vec4(Pi.xy,Pi1.xy)+vec2(50.0,161.0).xyxy;
  Pt*=Pt;Pt=Pt.xzxz*Pt.yyww;
  const vec3 SLF=vec3(635.298681,682.357502,668.926525);
  const vec3 ZI=vec3(48.500388,65.294118,63.934599);
  vec3 lz=vec3(1.0/(SLF+Pi.zzz*ZI));vec3 hz=vec3(1.0/(SLF+Pi1.zzz*ZI));
  vec4 hx0=fract(Pt*lz.xxxx);vec4 hx1=fract(Pt*hz.xxxx);
  vec4 hy0=fract(Pt*lz.yyyy);vec4 hy1=fract(Pt*hz.yyyy);
  vec4 hz0=fract(Pt*lz.zzzz);vec4 hz1=fract(Pt*hz.zzzz);
  vec4 gx0=hx0-.49999;vec4 gy0=hy0-.49999;vec4 gz0=hz0-.49999;
  vec4 gx1=hx1-.49999;vec4 gy1=hy1-.49999;vec4 gz1=hz1-.49999;
  vec4 gr0=inversesqrt(gx0*gx0+gy0*gy0+gz0*gz0)*(vec2(Pf.x,Pf1.x).xyxy*gx0+vec2(Pf.y,Pf1.y).xxyy*gy0+Pf.zzzz*gz0);
  vec4 gr1=inversesqrt(gx1*gx1+gy1*gy1+gz1*gz1)*(vec2(Pf.x,Pf1.x).xyxy*gx1+vec2(Pf.y,Pf1.y).xxyy*gy1+Pf1.zzzz*gz1);
  vec3 bl=Pf*Pf*Pf*(Pf*(Pf*6.0-15.0)+10.0);
  vec4 r0=mix(gr0,gr1,bl.z);
  vec4 bl2=vec4(bl.xy,vec2(1.0-bl.xy));
  return dot(r0,bl2.zxzx*bl2.wwyy)*1.1547005383792515;}
float p2(vec2 pos,float t){return(perlin3(vec3(pos,t))+1.)*.5;}
float nf(vec2 pos,float dist,float rot,float t){t*=1.+dist/100.;pos+=vec2(t*rot,0.)*.5;return p2(pos*dist+vec2(dist),t*2.);}
vec3 fbm(vec2 pos,float t){
  vec3 n=vec3(.05);pos+=p2(pos*.5,t)*.1;
  n+=nf(pos,1.,.01,t)*vec3(.25,1.,.5);
  n+=nf(pos,5.,.025,t)*.85*vec3(.75,1.,1.);
  n+=nf(pos,10.,.05,t)*.5*vec3(.25,1.,1.);
  n+=nf(pos,20.,.1,t)*.25*vec3(1.,0.,.2);
  n+=nf(pos,75.,.15,t)*.1*vec3(1.,1.,1.);
  return n;}
float circle(vec2 pos,float r){return smoothstep(30./iResolution.y,-30./iResolution.y,length(pos)-r);}
float highlight(float c,vec2 pos,float r){float h=smoothstep(0.,r,length(pos));h-=1.-c;return h*(.4+(sin(iTime)+1.)*.1);}
vec3 hueShift(vec3 col,float adj){
  const vec3 kRY=vec3(.299,.587,.114);const vec3 kRI=vec3(.596,-.275,-.321);const vec3 kRQ=vec3(.212,-.523,.311);
  const vec3 kYR=vec3(1.,.956,.621);const vec3 kYG=vec3(1.,-.272,-.647);const vec3 kYB=vec3(1.,-1.107,1.704);
  float Y=dot(col,kRY);float I=dot(col,kRI);float Q=dot(col,kRQ);
  float hue=atan(Q,I);float chr=sqrt(I*I+Q*Q);hue+=adj;Q=chr*sin(hue);I=chr*cos(hue);
  vec3 yiq=vec3(Y,I,Q);return vec3(dot(yiq,kYR),dot(yiq,kYG),dot(yiq,kYB));}
void main(){
  vec2 pos=(-iResolution.xy+2.0*gl_FragCoord.xy)/iResolution.y;
  pos.x+=noise1D(iTime)*.05;pos.y+=noise1D(iTime+10.)*.05;
  pos+=p2(pos*2.,iTime)*.1;pos*=1.1;
  float radius=.9+sin(iTime*4.)*.1+iBreath*.12;
  pos*=.5+pow(length(pos),10.);
  vec3 n=fbm(pos,iTime);vec3 ci=vec3(circle(pos,radius));vec3 hl=vec3(highlight(ci.r,pos,radius));
  vec3 res=clamp(ci-n,vec3(0.),vec3(1.));res.rgb=res.bgr;res*=2.;
  res+=hl*vec3(1.,.2,.5);res=hueShift(res,5.+sin(iTime)+iBreath*2.);res*=1.4;
  gl_FragColor=vec4(res,1.);}`;

  function mkShader(type,src){
    const s=gl.createShader(type);
    gl.shaderSource(s,src);gl.compileShader(s);return s;
  }
  const prog=gl.createProgram();
  gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const aPos=gl.getAttribLocation(prog,'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  const uRes=gl.getUniformLocation(prog,'iResolution');
  const uTime=gl.getUniformLocation(prog,'iTime');
  const uBreath=gl.getUniformLocation(prog,'iBreath');
  gl.uniform2f(uRes,S,S);

  /* Organic arc */
  function wobblePt(angle,r,t){
    const dr=Math.sin(angle*3+t*0.8)*3
             +Math.sin(angle*7-t*0.5)*1.5
             +Math.sin(angle*13+t*1.2)*0.8;
    return{x:S/2+Math.cos(angle)*(r+dr),y:S/2+Math.sin(angle)*(r+dr)};
  }
  function drawArc(progress,isInhale,t){
    const r=108,N=200;
    arcCtx.clearRect(0,0,S,S);
    arcCtx.beginPath();
    for(let i=0;i<=N;i++){
      const a=(i/N)*Math.PI*2;
      const p=wobblePt(a,r,t*0.4);
      i===0?arcCtx.moveTo(p.x,p.y):arcCtx.lineTo(p.x,p.y);
    }
    arcCtx.closePath();
    arcCtx.strokeStyle='rgba(0,255,80,0.1)';
    arcCtx.lineWidth=2;arcCtx.stroke();
    if(progress<=0)return;
    arcCtx.beginPath();
    let first=true;
    for(let i=0;i<=N;i++){
      const a=-Math.PI/2+(i/N)*progress*Math.PI*2;
      const p=wobblePt(a,r,t);
      if(first){arcCtx.moveTo(p.x,p.y);first=false;}
      else arcCtx.lineTo(p.x,p.y);
    }
    arcCtx.strokeStyle=isInhale?'rgba(0,255,80,0.85)':'rgba(0,200,60,0.7)';
    arcCtx.lineWidth=3.5;arcCtx.lineCap='round';arcCtx.stroke();
    const ep=wobblePt(-Math.PI/2+progress*Math.PI*2,r,t);
    arcCtx.beginPath();
    arcCtx.arc(ep.x,ep.y,4,0,Math.PI*2);
    arcCtx.fillStyle='#00ff55';
    arcCtx.shadowBlur=12;arcCtx.shadowColor='#00ff55';
    arcCtx.fill();arcCtx.shadowBlur=0;
  }

  /* Cycle: VDIHI 4s → pause 1s → IZDIHI 4s → pause 1s → ×3 */
  const INHALE=4000,PAUSE=1000,EXHALE=4000,CYCLE=10000,TOTAL=30000;
  wrap.style.display='flex';
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add('vis')));
  const t0=performance.now();
  let active=true,smoothBreath=0;
  const bparts=[];

  function drawBParts(gt){
    const cx=S/2,cy=S/2;
    if(smoothBreath>0.05){
      for(let i=0;i<Math.ceil(smoothBreath*4);i++){
        const ang=Math.random()*Math.PI*2,r2=90+Math.random()*30;
        bparts.push({x:cx+Math.cos(ang)*r2,y:cy+Math.sin(ang)*r2,
          vx:Math.cos(ang)*(smoothBreath*18+Math.random()*4),
          vy:Math.sin(ang)*(smoothBreath*18+Math.random()*4),
          life:1,hue:120+smoothBreath*60});
      }
    }
    while(bparts.length>150)bparts.shift();
    for(let i=bparts.length-1;i>=0;i--){
      const p=bparts[i];
      const dx=p.x-cx,dy=p.y-cy;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      const pull=(dist-100)*0.015;
      p.vx-=(dx/dist)*pull;p.vy-=(dy/dist)*pull;
      p.vx*=0.94;p.vy*=0.94;
      p.x+=p.vx;p.y+=p.vy;
      p.life-=0.018;
      if(p.life<=0){bparts.splice(i,1);continue;}
      arcCtx.beginPath();
      arcCtx.arc(p.x,p.y,Math.max(0.001,p.life*2.5),0,Math.PI*2);
      arcCtx.fillStyle=`hsla(${p.hue+gt*30},90%,65%,${p.life*0.75})`;
      arcCtx.fill();
    }
  }

  function btTick(now){
    if(!active)return;
    const e=now-t0,gt=e/1000;
    const mv=getMicVolume();
    smoothBreath+=(mv-smoothBreath)*0.15;
    gl.uniform1f(uTime,gt);
    gl.uniform1f(uBreath,smoothBreath);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    if(e>=TOTAL){
      active=false;
      drawArc(0,true,gt);
      numEl.textContent='';
      lblIn.style.color='';lblEx.style.color='';
      wrap.classList.remove('vis');
      setTimeout(()=>{wrap.style.display='none';onDone();},1000);
      return;
    }
    const ct=e%CYCLE;
    let progress,isInhale;
    if(ct<INHALE){
      progress=ct/INHALE;isInhale=true;
      numEl.textContent=Math.ceil((INHALE-ct)/1000)||1;
      lblIn.style.color='#00e040';lblEx.style.color='#1a4a1a';
    }else if(ct<INHALE+PAUSE){
      progress=1;isInhale=true;
      numEl.textContent='';
      lblIn.style.color='rgba(255,255,255,0.1)';lblEx.style.color='rgba(255,255,255,0.1)';
    }else if(ct<INHALE+PAUSE+EXHALE){
      const x=ct-INHALE-PAUSE;
      progress=1-x/EXHALE;isInhale=false;
      numEl.textContent=Math.ceil((EXHALE-x)/1000)||1;
      lblIn.style.color='#1a4a1a';lblEx.style.color='#00e040';
    }else{
      progress=0;isInhale=false;
      numEl.textContent='';
      lblIn.style.color='rgba(255,255,255,0.1)';lblEx.style.color='rgba(255,255,255,0.1)';
    }
    drawArc(progress,isInhale,gt);
    drawBParts(gt);
    requestAnimationFrame(btTick);
  }
  requestAnimationFrame(btTick);
}

/* ── Main Loop ── */
let p3started=false;

function arLoop(){
  requestAnimationFrame(arLoop);
  if(phase<2) return;

  if(markerSeen && phAlpha<1) phAlpha=Math.min(1,phAlpha+FADE_IN);
  if(!markerSeen && phAlpha>0) phAlpha=Math.max(0,phAlpha-FADE_OUT);
  if(!markerSeen && phAlpha<=0){
    phActive=false;
    pools.forEach(p=>p.particles=[]);
  }

  stepParticles();

  if(markerSeen && !p3started){ p3started=true; setTimeout(startPhase3,60000); }
}

function startPhase3(){
  phase=3;
  document.getElementById('p3').classList.add('on');
  let n=10;
  const cd=document.getElementById('countdown');
  cd.textContent=n;
  const iv=setInterval(()=>{
    n--;
    if(n>0){ cd.textContent=n; }
    else{ clearInterval(iv); cd.style.display='none'; document.getElementById('end-text').style.display='block'; }
  },1000);
}

/* ── Weather ── */
async function fetchWeather(){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,direct_radiation,vapour_pressure_deficit&hourly=soil_moisture_0_to_1cm&timezone=auto&forecast_days=1`;
    const d=await(await fetch(url)).json();
    const c=d.current, h=new Date().getHours();
    weather={
      temp:c.temperature_2m??14,
      humidity:c.relative_humidity_2m??65,
      radiation:c.direct_radiation??180,
      wind:c.wind_speed_10m??1.8,
      soilMoisture:d.hourly?.soil_moisture_0_to_1cm?.[h]??0.3,
      vpd:c.vapour_pressure_deficit??0.8
    };
    document.getElementById('v-s').textContent=weather.radiation.toFixed(0)+' W/m²';
    document.getElementById('v-h').textContent=weather.humidity.toFixed(0)+'%';
    document.getElementById('v-t').textContent=weather.temp.toFixed(1)+'°C';
    document.getElementById('v-w').textContent=weather.wind.toFixed(1)+' m/s';
    const rad=weather.radiation,hum=weather.humidity,tmp=weather.temp;
    const hl=Math.max(0,Math.min(10,(rad/500)*10));
    const co2=((6+(rad/500)*5+(hum/100)*2)*hl*0.7).toFixed(1);
    const psi=((-0.8-(tmp/30)*0.6-(1-hum/100)*0.8)).toFixed(2);
    const flow=(15+(rad/500)*35+(hum/100)*20).toFixed(0);
    document.getElementById('sci-main').textContent=`danes je to drevo absorbiralo ${co2} kg CO₂`;
    document.getElementById('sci-sub').textContent=`vodni potencial ${psi} MPa · tok ${flow} ml/h · sevanje ${rad.toFixed(0)} W/m²`;
  }catch(e){}
}

  {label:'TREE_01 · MESTNI GOZD CELJE',title:'Smreka',sub:'Picea abies',
   data:['VIŠINA ~28m','STAROST ~80 let','OBSEG 1.8m']},

];
let csIdx=0,csOn=false,csRaf=null,csAscIv=null,csStill=null,csT0=null,csRound=0;
const CS_DUR=10000;
let csCW=0,csCH=0;
const CS_SET='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*{}[]<>/|;:,.~`=+-_';
let csGrid=[];
const CS_GW=8,CS_GH=13;

function csInitMotion(){
  if(typeof DeviceMotionEvent!=='undefined'&&
     typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission()
      .then(r=>{if(r==='granted')csMotion();})
      .catch(()=>csMotion());
  }else{csMotion();}
}

function csMotion(){
  let last={x:0,y:0,z:0};
  window.addEventListener('devicemotion',e=>{
    if(phase<2||!markerSeen){csStill=null;return;}
    const a=e.accelerationIncludingGravity||{};
    const dx=(a.x||0)-last.x,dy=(a.y||0)-last.y,dz=(a.z||0)-last.z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
    last={x:a.x||0,y:a.y||0,z:a.z||0};
    if(d<0.3){
      if(!csStill)csStill=performance.now();
      else if(!csOn&&performance.now()-csStill>=2000)csStart();
    }else{csStill=null;if(csOn)csCancel();}
  });
}

function csStart(){
  csOn=true;
  csCW=Math.min(window.innerWidth*0.9,340);
  csCH=window.innerHeight*0.8;
  const cv=document.getElementById('cs-canvas');
  cv.width=Math.round(csCW);cv.height=Math.round(csCH);
  csGrid=[];csT0=null;
  csBuild(csIdx);
  document.getElementById('cs-overlay').classList.add('on');
  csAscIv=setInterval(csTick,150);
  csRaf=requestAnimationFrame(csBeam);
}

function csCancel(){
  csOn=false;
  if(csRaf){cancelAnimationFrame(csRaf);csRaf=null;}
  if(csAscIv){clearInterval(csAscIv);csAscIv=null;}
  document.getElementById('cs-overlay').classList.remove('on');
  csStill=null;
}

function csBuild(i){
  const c=CS_DATA[i];
  let h=`<div class="cs-label">${c.label}</div>`;
  h+=`<div class="cs-title">${c.title}</div>`;
  if(c.sub)h+=`<div class="cs-sub">${c.sub}</div>`;
  h+=`<div class="cs-div"></div>`;
  if(c.data)c.data.forEach(d=>h+=`<div class="cs-data">${d}</div>`);
  if(c.live){
    const rad=weather.radiation||0,co2=(rad*0.0015).toFixed(2);
    h+=`<div class="cs-data">SONČNO SEVANJE: ${rad.toFixed(0)} W/m²</div>`;
    h+=`<div class="cs-data">VLAŽNOST: ${(weather.humidity||0).toFixed(0)} %</div>`;
    h+=`<div class="cs-data">TEMP: ${(weather.temp||0).toFixed(1)} °C</div>`;
    h+=`<div class="cs-data">CO₂ danes: ${co2} kg</div>`;
  }
  if(c.text)h+=`<div class="cs-text">${c.text}</div>`;
  if(c.small)h+=`<div class="cs-small">${c.small}</div>`;
  const el=document.getElementById('cs-content');
  el.innerHTML=h;el.style.clipPath='inset(0 0 100% 0)';
}

function csTick(){
  const cols=Math.floor(csCW/CS_GW),rows=Math.floor(csCH/CS_GH);
  const by=csT0?Math.min((performance.now()-csT0)/CS_DUR,1)*csCH:0;
  const br=Math.ceil(by/CS_GH);
  if(!csGrid.length){
    for(let r=0;r<rows;r++){
      csGrid[r]=[];
      for(let c=0;c<cols;c++)csGrid[r][c]=CS_SET[Math.random()*CS_SET.length|0];
    }
  }else{
    for(let r=br;r<rows;r++)
      for(let c=0;c<cols;c++)
        if(Math.random()<0.25)csGrid[r][c]=CS_SET[Math.random()*CS_SET.length|0];
  }
}

function csBeam(now){
  if(!csT0)csT0=now;
  const prog=Math.min((now-csT0)/CS_DUR,1);
  const y=prog*csCH;
  const cv=document.getElementById('cs-canvas');
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,csCW,csCH);

  /* ASCII below beam */
  const cols=Math.floor(csCW/CS_GW),rows=Math.floor(csCH/CS_GH);
  const sr=Math.ceil(y/CS_GH);
  ctx.font=`${CS_GH}px 'Courier New',monospace`;
  ctx.fillStyle='rgba(160,255,160,0.6)';
  for(let r=sr;r<rows;r++){
    if(!csGrid[r])continue;
    for(let c2=0;c2<cols;c2++)
      ctx.fillText(csGrid[r][c2]||' ',c2*CS_GW,(r+1)*CS_GH);
  }

  /* Purple halo glow layers */
  [[60,0.05],[32,0.10],[14,0.18],[5,0.35]].forEach(([bw,a])=>{
    const hh=bw*1.2;
    const g=ctx.createLinearGradient(0,y-hh,0,y+hh);
    g.addColorStop(0,'transparent');
    g.addColorStop(0.5,`rgba(140,60,255,${a})`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,y-hh,csCW,hh*2);
  });
  /* White core 1px */
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.fillRect(0,y-0.5,csCW,1);

  /* 80 beam particles */
  for(let i=0;i<80;i++){
    const px=Math.random()*csCW;
    const py=y+Math.sin(i*1.9+now*0.003)*7;
    const white=Math.random()<0.7;
    ctx.beginPath();ctx.arc(px,py,white?1:1.5,0,Math.PI*2);
    ctx.fillStyle=white?'rgba(255,255,255,0.9)':'rgba(180,100,255,0.85)';
    ctx.fill();
    if(Math.random()<0.22){
      const ang=Math.random()*Math.PI*2,dist=Math.random()*22;
      const sx=px+Math.cos(ang)*dist,sy=py+Math.sin(ang)*dist;
      if(sx>=0&&sx<=csCW&&sy>=0&&sy<=csCH){
        ctx.beginPath();ctx.arc(sx,sy,0.5,0,Math.PI*2);
        ctx.fillStyle=white?'rgba(255,255,255,0.35)':'rgba(180,100,255,0.35)';
        ctx.fill();
      }
    }
  }

  /* Reveal card content above beam */
  document.getElementById('cs-content').style.clipPath=
    prog>=1?'none':`inset(0 0 ${Math.round((1-prog)*100)}% 0)`;

  if(prog<1){csRaf=requestAnimationFrame(csBeam);}
  else{
    ctx.clearRect(0,0,csCW,csCH);
    if(csAscIv){clearInterval(csAscIv);csAscIv=null;}
    setTimeout(()=>{
      const ov=document.getElementById('cs-overlay');
      ov.style.transition='opacity 1s';ov.style.opacity='0';
      setTimeout(()=>{
        ov.classList.remove('on');ov.style.opacity='';ov.style.transition='';
        csOn=false;
        const nxt=(csIdx+1)%CS_DATA.length;
        if(nxt===0)csRound++;
        csIdx=nxt;csStill=null;
        if(csRound>=1&&csIdx===0){startFinale();return;}
        if(phase>=2&&markerSeen)setTimeout(csStart,800);
      },1000);
    },3000);
  }
}

/* ── Finale ── */
function fnSample(text,fontSize,W){
  const H2=fontSize*3;
  const tc=document.createElement('canvas');
  tc.width=W;tc.height=H2;
  const tx=tc.getContext('2d');
  tx.font=`italic ${fontSize}px Georgia,serif`;
  tx.fillStyle='#fff';tx.textAlign='center';tx.textBaseline='middle';
  tx.fillText(text,W/2,H2/2);
  const id=tx.getImageData(0,0,W,H2);
  const pts=[];
  for(let y=0;y<H2;y+=3)
    for(let x=0;x<W;x+=3)
      if(id.data[(y*W+x)*4+3]>60)pts.push({x,dy:y-H2/2});
  return pts;
}

function startFinale(){
  const cv=document.getElementById('cs-finale');
  const FW=window.innerWidth,FH=window.innerHeight;
  cv.width=FW;cv.height=FH;cv.style.display='block';
  const ctx=cv.getContext('2d');
  const fs=Math.min(Math.max(FW*0.06,24),52);
  const pts1=fnSample('Pospravi telefon.',fs,FW);
  const pts2=fnSample('Objami drevo.',fs,FW);
  const cy1=FH*0.42,cy2=FH*0.58;
  function mk(pts,cy,baseDelay){
    return pts.map(p=>({
      tx:p.x,ty:cy+p.dy,
      x:Math.random()*FW,y:Math.random()*FH,
      vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,
      life:1,st:0,delay:baseDelay+Math.random()*400
    }));
  }
  const fp=[...mk(pts1,cy1,0),...mk(pts2,cy2,3500)];
  const fnT0=performance.now();

  function fnDraw(now){
    const el=now-fnT0;
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.fillRect(0,0,FW,FH);
    let alive=false;
    for(const p of fp){
      if(el<p.delay){alive=true;continue;}
      if(!p.st)p.st=now;
      const t=now-p.st;
      if(t<1500){
        p.x+=p.vx;p.y+=p.vy;p.vx*=0.97;p.vy*=0.97;alive=true;
      }else if(t<4500){
        const dx=p.tx-p.x,dy=p.ty-p.y;
        p.vx+=dx*0.06;p.vy+=dy*0.06;
        p.vx*=0.82;p.vy*=0.82;
        p.x+=p.vx;p.y+=p.vy;alive=true;
      }else if(el<10500){
        p.x=p.tx;p.y=p.ty;alive=true;
      }else{
        p.vx+=(Math.random()-0.5)*2;p.vy+=(Math.random()-0.5)*2;
        p.x+=p.vx;p.y+=p.vy;p.life-=0.006;
        if(p.life>0)alive=true;
      }
      if(p.life<=0)continue;
      const hue=120+(p.tx/FW)*60;
      ctx.beginPath();ctx.arc(p.x,p.y,1.5,0,Math.PI*2);
      ctx.fillStyle=`hsla(${hue},85%,65%,${p.life*0.9})`;
      ctx.fill();
    }
    if(alive&&el<14000){requestAnimationFrame(fnDraw);}
    else{
      cv.style.display='none';
      ctx.clearRect(0,0,FW,FH);
      csRound=0;csIdx=0;
    }
  }
  requestAnimationFrame(fnDraw);
}

/* ── Start ── */
document.getElementById('btn-start').addEventListener('click',()=>{
  document.getElementById('p0').classList.add('out');
  setTimeout(()=>document.getElementById('p0').style.display='none',900);
  csInitMotion();

  runBreathing(async()=>{
    document.getElementById('p-wait').classList.add('on');
    initAR();
    await new Promise(resolve=>{
      const iv=setInterval(()=>{
        const cams=[...document.querySelectorAll('video')].filter(v=>v.readyState>=2&&v.videoWidth>0);
        if(cams.length){clearInterval(iv);resolve();}
      },300);
      setTimeout(()=>{clearInterval(iv);resolve();},10000);
    });
    document.getElementById('p-wait').classList.remove('on');
    await fetchWeather();
    setInterval(fetchWeather,60000);
    phase=2;
    document.getElementById('p2').classList.add('on');
    setTimeout(()=>document.getElementById('hud').classList.add('on'),600);
    setTimeout(()=>document.getElementById('tree-id').classList.add('on'),900);
    setTimeout(()=>document.getElementById('sci').classList.add('on'),1800);
    arLoop();
  });
});
</script>
