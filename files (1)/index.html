<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Planet Intelligence — Akumulacija tišine</title>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#fff}
/* AR.jsのUI要素のみ非表示（カメラ映像は残す） */
.arjs-loader,#arjs-instructions,.arjs-instructions,
.a-enter-vr,.a-orientation-modal,
a-scene>div{display:none!important;pointer-events:none!important}
/* カメラ映像：背面に全画面表示 */
video:not(#ar-vessel){
  position:fixed!important;top:0!important;left:0!important;
  width:100vw!important;height:100vh!important;
  object-fit:cover!important;z-index:0!important;
  transform:none!important}
.a-canvas{position:fixed!important;top:0!important;left:0!important;
  width:100vw!important;height:100vh!important;z-index:1!important;pointer-events:none!important}
a-scene{position:fixed!important;top:0!important;left:0!important;
  width:100vw!important;height:100vh!important;z-index:1!important;
  pointer-events:none!important;background:transparent!important}
#p0{position:fixed;inset:0;z-index:50;background:#0c0c0c;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  transition:opacity 0.8s}
#p0.out{opacity:0;pointer-events:none}
@keyframes wv1{0%{transform:translate(-50%,-75%) rotate(0deg)}100%{transform:translate(-50%,-75%) rotate(360deg)}}
@keyframes wv2{0%{transform:translate(-50%,-75%) rotate(0deg)}100%{transform:translate(-50%,-75%) rotate(-360deg)}}
.top-label{font-size:15px;letter-spacing:0.4em;color:#aaa;text-transform:uppercase}
.lt{position:relative;display:inline-block;padding:44px 90px;overflow:hidden;border-radius:70px}
.lt span{position:relative;z-index:2;font-family:Georgia,serif;font-style:italic;font-size:clamp(42px,10vw,82px);color:#fff;line-height:1.2;text-align:center;display:block}
.lb{position:absolute;top:-100px;left:0;width:100%;height:300%;background:hsl(200,100%,38%);box-shadow:inset 0 0 60px rgba(0,0,0,0.4),0 0 80px rgba(0,180,255,0.5),0 0 160px rgba(0,120,255,0.3)}
.lb::before{content:'';width:220%;height:220%;position:absolute;top:0;left:50%;transform:translate(-50%,-75%);border-radius:48%;background:rgba(0,4,18,1);animation:wv1 14s linear infinite}
.lb::after{content:'';width:220%;height:220%;position:absolute;top:0;left:50%;transform:translate(-50%,-75%);border-radius:42%;background:rgba(0,10,40,0.5);animation:wv2 20s linear infinite}
#btn-start{background:none;border:1px solid #777;color:#ccc;font-family:'Courier New',monospace;font-size:15px;letter-spacing:0.4em;text-transform:uppercase;padding:18px 52px;cursor:pointer;transition:all 0.4s;margin-top:8px}
#btn-start:hover{border-color:#fff;color:#fff}
.copy{font-size:12px;color:#444;position:absolute;bottom:28px;left:50%;transform:translateX(-50%);white-space:nowrap}
#p-wait{position:fixed;inset:0;z-index:40;background:#000;
  display:none;align-items:center;justify-content:center;
  font-size:10px;letter-spacing:0.3em;color:rgba(255,255,255,0.3)}
#p-wait.on{display:flex}
#p2{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity 1.5s}
#p2.on{opacity:1}
#ph-cv{position:fixed;inset:0;z-index:20;pointer-events:none}
#hud{position:fixed;top:20px;left:18px;z-index:30;
  font-size:10px;letter-spacing:0.1em;line-height:2;pointer-events:none;
  opacity:0;transition:opacity 2s}
#hud.on{opacity:1}
.hv-s{color:#ffd060}.hv-h{color:#60c8ff}.hv-t{color:#ff7040}.hv-w{color:rgba(255,255,255,0.8)}
.hl{color:rgba(255,255,255,0.28);margin-right:6px}
#tree-id{position:fixed;top:20px;right:18px;z-index:30;text-align:right;
  font-size:9px;letter-spacing:0.18em;color:rgba(255,255,255,0.25);
  opacity:0;transition:opacity 2s;pointer-events:none}
#tree-id.on{opacity:1}
#sci{position:fixed;bottom:0;left:0;right:0;z-index:30;
  padding:24px 28px 32px;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,0.72) 0%,transparent 100%);
  opacity:0;transition:opacity 2.5s}
#sci.on{opacity:1}
#sci-main{font-size:clamp(16px,4.2vw,24px);font-family:Georgia,serif;font-style:italic;
  color:rgba(255,255,255,0.9);line-height:1.5;margin-bottom:8px}
#sci-sub{font-size:11px;letter-spacing:0.14em;color:#b8ff50}
#p3{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity 1.2s}
#p3.on{opacity:1;pointer-events:auto;background:rgba(0,0,0,0.85)}
#countdown{font-size:clamp(80px,22vw,160px);font-family:Georgia,serif;
  color:#fff;opacity:0.9;line-height:1}
#end-text{display:none;text-align:center}
#end-line1{font-size:clamp(22px,5.5vw,36px);font-family:Georgia,serif;font-style:italic;
  color:#fff;margin-bottom:16px;line-height:1.4}
#end-line2{font-size:11px;letter-spacing:0.25em;color:rgba(255,255,255,0.35)}
</style>
</head>
<body>

<div id="p0">
  <p class="top-label">Mestni gozd Celje</p>
  <div class="lt">
    <div class="lb"></div>
    <span>Akumulacija<br>tišine</span>
  </div>
  <button id="btn-start">▶ &nbsp; ZAČNI</button>
  <p class="copy">© Keiko Miyazaki &amp; Darija Cvikl 2026</p>
</div>

<div id="p-wait">INITIALIZING CAMERA…</div>

<div id="p2">
  <canvas id="ph-cv"></canvas>
  <div id="hud">
    <div><span class="hl">SOLAR</span><span id="v-s" class="hv-s">—</span></div>
    <div><span class="hl">HUMID</span><span id="v-h" class="hv-h">—</span></div>
    <div><span class="hl">TEMP</span><span id="v-t" class="hv-t">—</span></div>
    <div><span class="hl">WIND</span><span id="v-w" class="hv-w">—</span></div>
  </div>
  <div id="tree-id">TREE_01<br>Picea abies</div>
  <div id="sci">
    <div id="sci-main"></div>
    <div id="sci-sub"></div>
  </div>
</div>

<div id="p3">
  <div id="countdown">10</div>
  <div id="end-text">
    <div id="end-line1">Pospravi telefon,<br>objami drevo.</div>
    <div id="end-line2">Put down your phone. Hug the tree.</div>
  </div>
</div>

<script>
const LAT=46.227222, LON=15.259167;
let W=window.innerWidth, H=window.innerHeight;
let markerSeen=false, phActive=false, phAlpha=0, phase=0, tick=0;
let weather={temp:14,humidity:65,radiation:180,wind:1.8,soilMoisture:0.3,vpd:0.8};

const phCv=document.getElementById('ph-cv');
const phCtx=phCv.getContext('2d');
function resize(){W=phCv.width=window.innerWidth;H=phCv.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);

const FADE_IN=0.008, FADE_OUT=0.015;

/* ── Particle Engine ── */
const PI=Math.PI, TAU=PI*2;
const attractors=[
  {x:0.3,y:0.4,freq:0.007,phase:0},
  {x:0.7,y:0.6,freq:0.011,phase:2.1},
  {x:0.5,y:0.2,freq:0.005,phase:4.3},
  {x:0.2,y:0.7,freq:0.009,phase:1.1},
  {x:0.8,y:0.3,freq:0.013,phase:3.7},
];

class Particle {
  constructor(ax,ay,hue){
    this.x=ax+(Math.random()-0.5)*60;
    this.y=ay+(Math.random()-0.5)*60;
    this.vx=(Math.random()-0.5)*0.8;
    this.vy=(Math.random()-0.5)*0.8;
    this.hue=hue+Math.random()*40-20;
    this.life=0.7+Math.random()*0.3;
    this.decay=0.003+Math.random()*0.002;
    this.wobble=Math.random()*TAU;
    this.wobbleSpeed=(Math.random()-0.5)*0.06;
  }
  step(tick){
    const spd=8*0.015;
    this.wobble+=this.wobbleSpeed;
    const nx=Math.sin(this.x*0.008+tick*0.003)*Math.cos(this.y*0.006);
    const ny=Math.cos(this.x*0.006-tick*0.002)*Math.sin(this.y*0.008);
    this.vx+=nx*spd+Math.sin(this.wobble)*0.03;
    this.vy+=ny*spd+Math.cos(this.wobble)*0.03;
    this.vx*=0.97; this.vy*=0.97;
    this.x+=this.vx; this.y+=this.vy;
    this.life-=this.decay;
  }
  draw(ctx,tick){
    const a=Math.max(0,this.life);
    ctx.fillStyle=`hsla(${this.hue+tick*0.2},70%,65%,${a*0.55})`;
    ctx.beginPath();
    ctx.arc(this.x,this.y,Math.max(0.001,a*4),0,TAU);
    ctx.fill();
  }
}

const pools=attractors.map((a,i)=>({attractor:a,hue:i*72,particles:[]}));

function stepParticles(){
  phCtx.clearRect(0,0,W,H);
  if(phAlpha<=0) return;
  phCtx.save();
  phCtx.globalAlpha=phAlpha;
  tick++;

  for(const pool of pools){
    const a=pool.attractor;
    const ax=(a.x+Math.sin(tick*a.freq+a.phase)*0.18)*W;
    const ay=(a.y+Math.cos(tick*a.freq*0.7+a.phase)*0.14)*H;

    if(phAlpha>0.1 && pool.particles.length<120){
      for(let i=0;i<3;i++) pool.particles.push(new Particle(ax,ay,pool.hue));
    }

    pool.particles=pool.particles.filter(p=>p.life>0);
    for(const p of pool.particles){ p.step(tick); p.draw(phCtx,tick); }

    phCtx.strokeStyle=`hsla(${pool.hue+tick*0.2},60%,70%,0.08)`;
    phCtx.lineWidth=0.5;
    const pts=pool.particles;
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
        if(dx*dx+dy*dy<3600){
          phCtx.beginPath();
          phCtx.moveTo(pts[i].x,pts[i].y);
          phCtx.lineTo(pts[j].x,pts[j].y);
          phCtx.stroke();
        }
      }
    }
  }
  phCtx.restore();
}

/* ── Video fullscreen fix（AR.jsのインライン上書き対策） ── */
function fixVideoSize(){
  document.querySelectorAll('video').forEach(v=>{
    if(v.id==='ar-vessel') return;
    v.style.setProperty('position','fixed','important');
    v.style.setProperty('top','0','important');
    v.style.setProperty('left','0','important');
    v.style.setProperty('width','100vw','important');
    v.style.setProperty('height','100vh','important');
    v.style.setProperty('object-fit','cover','important');
    v.style.setProperty('transform','none','important');
    v.style.setProperty('z-index','0','important');
  });
}
setInterval(fixVideoSize,400);

/* ── AR Setup ── */
let arMarkerEl=null;

function initAR(){
  const scene=document.createElement('a-scene');
  scene.setAttribute('embedded','');
  scene.setAttribute('arjs','sourceType:webcam;debugUIEnabled:false;uiScanning:no;uiError:no;uiLoading:no;patternRatio:0.5;');
  scene.setAttribute('renderer','alpha:true;antialias:false;');
  scene.setAttribute('vr-mode-ui','enabled:false');
  scene.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:2;pointer-events:none;background:transparent;';

  const marker=document.createElement('a-marker');
  marker.setAttribute('type','pattern');
  marker.setAttribute('url','pattern-pattern-Planet-A-square.patt');
  arMarkerEl=marker;

  marker.addEventListener('markerFound',()=>{ markerSeen=true; phActive=true; });
  marker.addEventListener('markerLost', ()=>{ markerSeen=false; });

  scene.appendChild(marker);
  const cam=document.createElement('a-entity');
  cam.setAttribute('camera','');
  scene.appendChild(cam);
  document.body.appendChild(scene);
}

/* ── Main Loop ── */
let p3started=false;

function arLoop(){
  requestAnimationFrame(arLoop);
  if(phase<2) return;

  if(markerSeen && phAlpha<1) phAlpha=Math.min(1,phAlpha+FADE_IN);
  if(!markerSeen && phAlpha>0) phAlpha=Math.max(0,phAlpha-FADE_OUT);
  if(!markerSeen && phAlpha<=0){
    phActive=false;
    pools.forEach(p=>p.particles=[]);
  }

  stepParticles();

  if(markerSeen && !p3started){ p3started=true; setTimeout(startPhase3,60000); }
}

function startPhase3(){
  phase=3;
  document.getElementById('p3').classList.add('on');
  let n=10;
  const cd=document.getElementById('countdown');
  cd.textContent=n;
  const iv=setInterval(()=>{
    n--;
    if(n>0){ cd.textContent=n; }
    else{ clearInterval(iv); cd.style.display='none'; document.getElementById('end-text').style.display='block'; }
  },1000);
}

/* ── Weather ── */
async function fetchWeather(){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,direct_radiation,vapour_pressure_deficit&hourly=soil_moisture_0_to_1cm&timezone=auto&forecast_days=1`;
    const d=await(await fetch(url)).json();
    const c=d.current, h=new Date().getHours();
    weather={
      temp:c.temperature_2m??14,
      humidity:c.relative_humidity_2m??65,
      radiation:c.direct_radiation??180,
      wind:c.wind_speed_10m??1.8,
      soilMoisture:d.hourly?.soil_moisture_0_to_1cm?.[h]??0.3,
      vpd:c.vapour_pressure_deficit??0.8
    };
    document.getElementById('v-s').textContent=weather.radiation.toFixed(0)+' W/m²';
    document.getElementById('v-h').textContent=weather.humidity.toFixed(0)+'%';
    document.getElementById('v-t').textContent=weather.temp.toFixed(1)+'°C';
    document.getElementById('v-w').textContent=weather.wind.toFixed(1)+' m/s';
    const rad=weather.radiation,hum=weather.humidity,tmp=weather.temp;
    const hl=Math.max(0,Math.min(10,(rad/500)*10));
    const co2=((6+(rad/500)*5+(hum/100)*2)*hl*0.7).toFixed(1);
    const psi=((-0.8-(tmp/30)*0.6-(1-hum/100)*0.8)).toFixed(2);
    const flow=(15+(rad/500)*35+(hum/100)*20).toFixed(0);
    document.getElementById('sci-main').textContent=`danes je to drevo absorbiralo ${co2} kg CO₂`;
    document.getElementById('sci-sub').textContent=`vodni potencial ${psi} MPa · tok ${flow} ml/h · sevanje ${rad.toFixed(0)} W/m²`;
  }catch(e){}
}

/* ── Start ── */
document.getElementById('btn-start').addEventListener('click',async()=>{
  document.getElementById('p0').classList.add('out');
  setTimeout(()=>document.getElementById('p0').style.display='none',900);
  document.getElementById('p-wait').classList.add('on');

  initAR();

  await new Promise(resolve=>{
    const iv=setInterval(()=>{
      const cams=[...document.querySelectorAll('video')].filter(v=>v.readyState>=2&&v.videoWidth>0);
      if(cams.length){clearInterval(iv);resolve();}
    },300);
    setTimeout(()=>{clearInterval(iv);resolve();},10000);
  });

  document.getElementById('p-wait').classList.remove('on');
  await fetchWeather();
  setInterval(fetchWeather,60000);

  phase=2;
  document.getElementById('p2').classList.add('on');
  setTimeout(()=>document.getElementById('hud').classList.add('on'),600);
  setTimeout(()=>document.getElementById('tree-id').classList.add('on'),900);
  setTimeout(()=>document.getElementById('sci').classList.add('on'),1800);
  arLoop();
});
</script>
</body>
</html>
